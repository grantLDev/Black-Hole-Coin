<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
<!--
  The root <svg> tag is deliberately the FIRST thing in this file, and the
  commentary that used to sit above it now lives inside the element. That is
  not style. Next's metadata image loader sizes this file with `image-size`,
  whose SVG detector only scans the first 1000 BYTES for the opening tag; if
  the tag ends past that offset the file is rejected with "is not a valid
  image file. The image may be corrupted or an unsupported format." With the
  comment on top the tag ended at byte 987 — twelve bytes of headroom, which a
  CRLF checkout on Windows spends immediately (seventeen line endings, tag ends
  at 1003) and the dev server fails to build. Anchored at byte 0 the margin is
  the whole window and the line-ending style stops mattering. Do not move a
  comment, an XML declaration or a DOCTYPE above this tag.

  The site icon. Picked up automatically by the App Router, which serves it at
  /icon.svg and injects the <link rel="icon"> that stops browsers falling back
  to a /favicon.ico this project does not have.

  SVG rather than a generated PNG: this is the one image in the project small
  enough to be drawn by hand, and a hand-drawn one stays reviewable in a diff
  and crisp at every size a browser asks for. It is drawn in the same order the
  raymarcher resolves the scene, which is what makes it read as a black hole at
  16px rather than as a ring: the lensed FAR side of the disk wraps over and
  under the shadow, the shadow occludes it, and the NEAR side crosses in front.
  Take the near band away and the silhouette collapses into a logo.

  The gradient's white point sits at 26% rather than the centre because the
  disk's approaching limb is Doppler-beamed, exactly as in the shader.
-->
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e88a3a"/>
      <stop offset="0.26" stop-color="#fffdf6"/>
      <stop offset="0.58" stop-color="#ffc98a"/>
      <stop offset="1" stop-color="#a83c09"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#05060a"/>
  <ellipse cx="16" cy="16" rx="13.4" ry="9.2" fill="none" stroke="url(#d)" stroke-width="2.2"/>
  <circle cx="16" cy="16" r="6.1" fill="#05060a"/>
  <circle cx="16" cy="16" r="6.1" fill="none" stroke="#ffe8ba" stroke-width="0.5" opacity="0.55"/>
  <path d="M2.6 16.9 A 13.4 2.2 0 0 0 29.4 16.9" fill="none" stroke="url(#d)" stroke-width="2.9" stroke-linecap="round"/>
</svg>
